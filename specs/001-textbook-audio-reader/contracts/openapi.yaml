openapi: 3.1.0
info:
  title: Textbook Audio Reader API
  version: 1.0.0
  description: Local OCR, speech, and seven-day recording-retention endpoints.
servers:
  - url: /
paths:
  /api/extract:
    post:
      summary: Extract reading-order text from one normalized page photo with local OCR
      operationId: extractPage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  contentMediaType: image/jpeg
                  format: binary
                  description: Upright JPEG no larger than 4 MiB or 2,400 px on its longest edge.
      responses:
        "200":
          description: Local OCR completed, including partial or unreadable results.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "500":
          $ref: "#/components/responses/InferenceFailure"
        "503":
          $ref: "#/components/responses/ModelUnavailable"
  /api/speech:
    post:
      summary: Create one WAV recording from ordered page text with local Kokoro inference
      operationId: createSpeech
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pages]
              properties:
                name:
                  type: [string, "null"]
                  maxLength: 100
                  description: Optional display name; surrounding and repeated whitespace is removed.
                pages:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description: Readable page text in confirmed order; combined text may not exceed 100,000 characters.
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, text]
                    properties:
                      id:
                        type: string
                        minLength: 1
                      text:
                        type: string
                        minLength: 1
      responses:
        "200":
          description: Complete local recording containing every supplied page in order and retained for seven days.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="textbook-reading.wav"
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InferenceFailure"
        "503":
          $ref: "#/components/responses/ModelUnavailable"
  /api/recordings:
    get:
      summary: List unexpired recordings, newest first
      operationId: listRecordings
      responses:
        "200":
          description: Recordings available for download.
          content:
            application/json:
              schema:
                type: object
                required: [recordings]
                properties:
                  recordings:
                    type: array
                    items:
                      $ref: "#/components/schemas/Recording"
  /api/recordings/{recording_id}:
    get:
      summary: Download an unexpired recording
      operationId: downloadRecording
      parameters:
        - name: recording_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saved WAV recording.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "404":
          description: Recording does not exist or has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      summary: Set or remove a recording's display name
      operationId: nameRecording
      parameters:
        - name: recording_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: [string, "null"]
                  maxLength: 100
      responses:
        "204":
          description: Recording name updated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/TooLarge"
        "404":
          description: Recording does not exist or has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      summary: Permanently delete a recording
      operationId: deleteRecording
      parameters:
        - name: recording_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Recording deleted.
        "404":
          description: Recording does not exist or has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Recording:
      type: object
      additionalProperties: false
      required: [id, name, created_at, expires_at, size]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: [string, "null"]
          maxLength: 100
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        size:
          type: integer
          minimum: 1
    ExtractionResult:
      type: object
      additionalProperties: false
      required: [status, issues, confidence, text]
      properties:
        status:
          type: string
          enum: [readable, partial, unreadable]
        issues:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [low_confidence, no_text]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        text:
          type: string
    Problem:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - invalid_image
            - too_large
            - unsupported_image
            - inference_failure
            - model_unavailable
            - not_found
        message:
          type: string
        retryable:
          type: boolean
  responses:
    BadRequest:
      description: Missing or invalid request data.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooLarge:
      description: Image, page count, or combined text exceeds an application limit.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMedia:
      description: The upload is not a valid JPEG image.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    InferenceFailure:
      description: Local OCR or speech inference failed after its model was loaded.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    ModelUnavailable:
      description: A required local model is not loaded or its files are unavailable.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
