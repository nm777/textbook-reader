[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "textbook-reader"
version = "0.1.0"
description = "Local textbook photo-to-audio reader"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "Pillow",
    "paddleocr==3.7.0",
    "paddlepaddle",
    "kokoro==0.9.4",
    "numpy",
    "SoundFile",
]

[tool.setuptools]
packages = ["reader"]
include-package-data = false

[tool.setuptools.package-data]
reader = ["static/*"]
