<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Textbook Audio Reader</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Textbook Audio Reader</h1>
    <p>Turn a photo of a textbook page into spoken audio.</p>
  </header>

  <main>
    <section aria-labelledby="add-pages-heading">
      <h2 id="add-pages-heading">Add a page</h2>

      <div>
        <label for="photo-input">Choose an existing photo</label>
        <input id="photo-input" name="photos" type="file" accept="image/*" multiple>
      </div>

      <div>
        <label for="camera-input">Take a photo with the rear camera</label>
        <input id="camera-input" name="camera-photo" type="file" accept="image/*" capture="environment">
      </div>
    </section>

    <section id="preview-region" aria-labelledby="preview-heading">
      <h2 id="preview-heading">Page preview</h2>
      <p id="page-count" aria-live="polite">0 pages selected</p>
      <div id="page-preview">
        <p id="preview-empty">No page selected.</p>
        <ol id="page-list" aria-label="Pages in reading order"></ol>
      </div>

      <template id="page-template">
        <li class="page-card" data-page-id="">
          <figure>
            <img data-page-preview alt="Selected textbook page preview">
            <figcaption>
              <strong>Page <span data-page-position></span></strong>
              <span data-page-file-name></span>
              <span data-page-extraction-state></span>
            </figcaption>
          </figure>
          <div class="page-actions" aria-label="Page actions">
            <button type="button" data-action="move-up" aria-label="Move page up">Move up</button>
            <button type="button" data-action="move-down" aria-label="Move page down">Move down</button>
            <button type="button" data-action="replace" aria-label="Replace page">Replace</button>
            <button type="button" data-action="remove" aria-label="Remove page">Remove</button>
            <button type="button" data-action="retry" aria-label="Retry page extraction">Retry</button>
          </div>
        </li>
      </template>
    </section>

    <div id="conversion-actions">
      <button id="convert-button" type="button" disabled>Confirm and convert</button>
      <button id="retry-button" type="button" hidden>Retry conversion</button>
    </div>

    <section aria-labelledby="status-heading">
      <h2 id="status-heading">Status</h2>
      <p id="status" role="status" aria-live="polite" aria-atomic="true">Add a page photo to begin.</p>
    </section>

    <section id="audio-result" aria-labelledby="audio-heading" hidden>
      <h2 id="audio-heading">Listen</h2>
      <audio id="audio-player" controls preload="metadata" aria-label="Generated textbook audio">
        Your browser does not support audio playback.
      </audio>
      <a id="audio-download" download="textbook-reading.wav" hidden>Download completed recording</a>
    </section>
  </main>
</body>
</html>
