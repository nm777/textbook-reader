<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Past Recordings | Textbook Audio Reader</title>
  <link rel="stylesheet" href="../static/styles.css">
  <script src="../static/recordings.js" defer></script>
</head>
<body>
  <header>
    <h1>Past Recordings</h1>
    <p>Download recordings created in the last seven days.</p>
  </header>

  <main>
    <p><a href="../">Back to the reader</a></p>
    <section aria-labelledby="recordings-heading">
      <h2 id="recordings-heading">Available recordings</h2>
      <p id="status" role="status" aria-live="polite" aria-busy="true">Loading recordings...</p>
      <ol id="recordings-list" hidden></ol>
    </section>
  </main>
</body>
</html>
